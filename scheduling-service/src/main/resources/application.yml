server:
  port: 8084

spring:
  application:
    name: scheduling-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/scheduling_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  graphql:
    graphiql:
      enabled: true
    path: /graphql
    schema:
      locations: classpath:/
      printer:
        enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true

app:
  rabbitmq:
    exchange:
      medical-exchange: ${RABBITMQ_EXCHANGE_MEDICAL:medical_exchange}
      dlq-medical-exchange: ${RABBITMQ_EXCHANGE_DLQ:dlq_medical_exchange}
    queue:
      email-queue: ${RABBITMQ_QUEUE_EMAIL:email_queue}
      dlq-queue: ${RABBITMQ_QUEUE_DLQ:dlq_queue}
    routing-key:
      dlq-notification: ${RABBITMQ_ROUTING_KEY_DLQ:dlq.notification}

security:
  jwt:
    secret: ${JWT_SECRET:chave-local-apenas-para-desenvolvimento}
    issuer: ${JWT_ISSUER:auth-service}

spring-doc:
  paths-to-match: /api/**/v1/**
  swagger-ui:
    use-root-path: true

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    br.com.medical.schedulingservice: ${LOG_LEVEL:INFO}
