server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3303/auth_service_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
    username: auth_service
    password: Auth@00
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true


security:
  jwt:
    secret: ${JWT_SECRET:chave-local-apenas-para-desenvolvimento}
    access-expiration: 3600000
    refresh-expiration: 604800000

spring-doc:
  paths-to-match: /api/**/v1/**
  swagger-ui:
    use-root-path: true



  endpoint:
    health:
      show-details: always

