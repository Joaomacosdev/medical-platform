spring.application.name=history-service
server.port=8083
spring.datasource.url=${HISTORY_DATASOURCE_URL:jdbc:h2:mem:historydb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${HISTORY_DATASOURCE_USERNAME:sa}
spring.datasource.password=${HISTORY_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.rabbitmq.host=${HISTORY_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${HISTORY_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${HISTORY_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${HISTORY_RABBITMQ_PASSWORD:guest}
app.rabbitmq.exchange.appointment-events=${HISTORY_RABBITMQ_EXCHANGE_APPOINTMENT_EVENTS:appointment.events}
app.rabbitmq.queue.appointment-events=${HISTORY_RABBITMQ_QUEUE_APPOINTMENT_EVENTS:history.appointment.events}
app.rabbitmq.routing-key.appointment-events=${HISTORY_RABBITMQ_ROUTING_KEY_APPOINTMENT_EVENTS:appointment.#}
